<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document to Speech</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <!-- The manifest is what lets phones "Add to Home Screen" as an app. -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 36rem;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    textarea {
      width: 100%;
      min-height: 10rem;
      font: inherit;
      padding: 0.75rem;
      box-sizing: border-box;
    }
    button {
      font: inherit;
      padding: 0.6rem 1.5rem;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.6; }
    #status { color: #666; margin-top: 0.75rem; min-height: 1.2em; }
    .hint { color: #888; font-size: 0.85rem; margin: 0.5rem 0; }
    progress { width: 100%; margin-top: 0.75rem; }
    audio { width: 100%; margin-top: 1rem; }
    .controls-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 0.75rem;
    }
    .player-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .transport { display: flex; gap: 0.5rem; align-items: center; }
    .transport button { padding: 0.3rem 0.7rem; }
    #readAlong { margin-top: 1rem; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .panel-head button { padding: 0.2rem 0.6rem; font-size: 0.85rem; }
    #panelText {
      max-height: 22rem;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      line-height: 1.7;
    }
    #panelText p { margin: 0.4rem 0; }
    .sent { cursor: pointer; }
    .sent:hover { outline: 1px dotted #bbb; }
    .sent.read { color: #b5b5b5; }
    .sent.current { background: #ffe9a8; border-radius: 3px; }
    #chapters { max-width: 45%; }
    select { font: inherit; }
    #resumeBox {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Document to Speech</h1>

  <!-- Shown only when a previous listen was left unfinished. -->
  <div id="resumeBox" hidden>
    <span>Continue listening: <strong id="resumeTitle"></strong>
      at <span id="resumeTime"></span></span>
    <button id="resumeBtn">Resume</button>
  </div>

  <p>
    Upload a document or paste text, press Speak — playback starts as soon
    as the first piece is ready, while the rest generates in the background.
  </p>

  <input type="file" id="file" accept=".txt,.pdf,.epub">
  <p class="hint">…or paste text below:</p>

  <textarea id="text" placeholder="Paste your text here…"></textarea>
  <div id="count" class="hint"></div>

  <div class="controls-row">
    <label>
      Voice
      <select id="voice">
        <option value="af_heart" selected>Heart — US female</option>
        <option value="af_bella">Bella — US female</option>
        <option value="af_nicole">Nicole — US female</option>
        <option value="af_sky">Sky — US female</option>
        <option value="am_adam">Adam — US male</option>
        <option value="am_michael">Michael — US male</option>
        <option value="bf_emma">Emma — UK female</option>
        <option value="bf_isabella">Isabella — UK female</option>
        <option value="bm_george">George — UK male</option>
        <option value="bm_fable">Fable — UK male</option>
      </select>
    </label>
    <button id="speak">Speak</button>
  </div>

  <p id="status"></p>
  <progress id="progress" hidden></progress>

  <div id="playerRow" hidden>
    <audio id="player" controls></audio>
    <div class="player-extras">
      <div class="transport">
        <button id="back15" title="Back 15 seconds">⟲ 15s</button>
        <button id="fwd15" title="Forward 15 seconds">15s ⟳</button>
        <label>
          Speed
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label>
          Sleep
          <select id="sleep">
            <option value="0" selected>off</option>
            <option value="10">10 s (test)</option>
            <option value="900">15 min</option>
            <option value="1800">30 min</option>
            <option value="3600">60 min</option>
          </select>
        </label>
      </div>
      <a id="download" download="narration.wav" hidden>Download audio</a>
    </div>
  </div>

  <!-- Read-along: the narrator's script, following the voice. Already-read
       sentences fade, the current one is highlighted. -->
  <div id="readAlong" hidden>
    <div class="panel-head">
      <select id="chapters" hidden></select>
      <span class="hint">Follow along — click any sentence to jump there</span>
      <button id="togglePanel">Hide</button>
    </div>
    <div id="panelText"></div>
  </div>

  <script>
    // ---- element references ----------------------------------------------
    const textBox = document.getElementById("text");
    const button = document.getElementById("speak");
    const status = document.getElementById("status");
    const player = document.getElementById("player");
    const filePicker = document.getElementById("file");
    const counter = document.getElementById("count");
    const progress = document.getElementById("progress");
    const playerRow = document.getElementById("playerRow");
    const speed = document.getElementById("speed");
    const download = document.getElementById("download");
    const voice = document.getElementById("voice");
    const resumeBox = document.getElementById("resumeBox");
    const resumeTitle = document.getElementById("resumeTitle");
    const resumeTime = document.getElementById("resumeTime");
    const resumeBtn = document.getElementById("resumeBtn");

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const fmtTime = (s) => {
      s = Math.floor(s);
      const m = Math.floor(s / 60), h = Math.floor(m / 60);
      const mm = String(m % 60).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
      return h > 0 ? `${h}:${mm}:${ss}` : `${m % 60}:${ss}`;
    };

    // ---- playback state --------------------------------------------------
    // While a job generates, we play chunk files one by one ("chunks" mode);
    // once the job is done, we switch to the stitched file ("full" mode),
    // which restores the full seek bar. playedSeconds tracks how much audio
    // came before the current chunk, so the position carries over exactly.
    let mode = "full";        // "chunks" | "full"
    let currentJob = null;    // { id, title, total }
    let chunkIndex = 0;
    let playedSeconds = 0;
    let readyChunks = 0;
    let jobDone = false;
    let waitingForChunk = false;
    let pendingSeek = null;   // seek to apply once metadata loads
    let chunkDurations = [];  // length of each chunk we've loaded, in seconds

    // Sum of all chunk durations before chunk i — i.e., where chunk i
    // starts on the document's overall timeline.
    const cumBefore = (i) => chunkDurations.slice(0, i).reduce((a, b) => a + (b || 0), 0);

    player.addEventListener("loadedmetadata", () => {
      player.playbackRate = parseFloat(speed.value);
      if (mode === "chunks") {
        chunkDurations[chunkIndex] = player.duration;
      }
      if (pendingSeek !== null) {
        player.currentTime = pendingSeek;
        pendingSeek = null;
      }
    });
    speed.addEventListener("change", () => {
      player.playbackRate = parseFloat(speed.value);
    });

    // ---- skip back/forward 15 s ------------------------------------------
    // In "full" mode this is one line. In "chunks" mode, the target moment
    // may live in a DIFFERENT chunk file, so we translate: figure out which
    // chunk the target lands in and how far into it, then jump there.
    function skip(delta) {
      if (!currentJob) return;

      if (mode === "full") {
        player.currentTime = Math.max(0, player.currentTime + delta);
        return;
      }

      const target = player.currentTime + delta;
      if (target < 0 && chunkIndex > 0) {
        // Lands in the previous chunk (whose duration we know — we played it).
        chunkIndex -= 1;
        playedSeconds = startOf(chunkIndex);
        pendingSeek = Math.max(0, durOf(chunkIndex) + target);
        playChunk(chunkIndex);
      } else if (player.duration && target > player.duration) {
        // Lands in the next chunk — if it's been generated yet.
        if (chunkIndex + 1 < readyChunks) {
          chunkIndex += 1;
          playedSeconds = startOf(chunkIndex);
          pendingSeek = target - player.duration;
          playChunk(chunkIndex);
        } else {
          // Can't skip into audio that doesn't exist yet: go to the end of
          // what we have, which triggers the normal "waiting" flow.
          player.currentTime = player.duration;
        }
      } else {
        player.currentTime = Math.max(0, target);
      }
    }
    document.getElementById("back15").addEventListener("click", () => skip(-15));
    document.getElementById("fwd15").addEventListener("click", () => skip(15));

    // ---- read-along panel ------------------------------------------------
    const readAlong = document.getElementById("readAlong");
    const panelText = document.getElementById("panelText");
    const togglePanel = document.getElementById("togglePanel");
    const chaptersSel = document.getElementById("chapters");

    let meta = [];            // [{text, start, duration}] from the server
    let chaptersData = [];    // [{title, chunk, offset}] from the server
    let sentSpans = [];       // every sentence <span>, in document order
    let chunkSentences = [];  // per chunk: { spans: [{el, chars}], totalChars }
    let lastMark = -1;        // flat index of the highlighted sentence

    // Prefer the server's exact timings when we have them; fall back to
    // the durations measured client-side as chunks loaded.
    function startOf(c) { return meta[c] !== undefined ? meta[c].start : cumBefore(c); }
    function durOf(c) { return meta[c] !== undefined ? meta[c].duration : (chunkDurations[c] || 0); }

    // Which chunk does a moment on the overall timeline fall in?
    function metaChunkAt(t) {
      let c = 0;
      while (c + 1 < meta.length && t >= meta[c].start + meta[c].duration) c += 1;
      return c;
    }

    // Jump to an absolute time — the shared engine behind clicking a
    // sentence and picking a chapter. Handles both playback modes.
    function seekToTime(t) {
      if (!currentJob) return;
      if (mode === "full") {
        pendingSeek = null;
        player.currentTime = t;
        player.play();
        return;
      }
      const c = metaChunkAt(t);
      if (c >= readyChunks) {
        status.textContent = "That part hasn't been generated yet — it's still on its way.";
        return;
      }
      chunkIndex = c;
      playedSeconds = startOf(c);
      waitingForChunk = false;
      pendingSeek = Math.max(0, t - startOf(c));
      playChunk(c);
    }

    togglePanel.addEventListener("click", () => {
      panelText.hidden = !panelText.hidden;
      togglePanel.textContent = panelText.hidden ? "Show" : "Hide";
    });

    const splitSentences = (t) =>
      t.split(/(?<=[.!?…]["'”’]?)\s+/).filter((s) => s.length > 0);

    // Time estimates weight sentences by characters the voice actually
    // SPEAKS (letters/digits). CJK, brackets, dashes and other decoration
    // take almost no audio time — counting them made the highlight lag
    // behind the voice through front matter and never light up unspoken
    // lines. Floor of 1 so nothing divides by zero.
    const speakableChars = (t) =>
      Math.max(1, (t.match(/[a-zA-Z0-9]/g) || []).length);

    // The voice also PAUSES: briefly after each sentence, longer at
    // paragraph ends. At Kokoro's ~15 chars/second speaking rate those
    // silences are worth roughly this many characters of time. Without
    // this "pause tax", runs of short lines (title pages!) cost almost
    // nothing on paper and the highlight sprints ahead of the voice.
    const SENTENCE_PAUSE = 5;    // ≈ a third of a second
    const PARAGRAPH_PAUSE = 7;   // extra, on a paragraph's last sentence

    function sentenceWeight(sentence, isLastInParagraph) {
      return speakableChars(sentence) + SENTENCE_PAUSE
        + (isLastInParagraph ? PARAGRAPH_PAUSE : 0);
    }

    // The same weighting applied to a whole text — used to map a chapter's
    // character offset to time with identical assumptions.
    function weightText(t) {
      let total = 0;
      for (const para of t.split("\n\n")) {
        const ss = splitSentences(para);
        ss.forEach((s, i) => {
          total += sentenceWeight(s, i === ss.length - 1);
        });
      }
      return Math.max(1, total);
    }

    function resetPanel() {
      panelText.innerHTML = "";
      meta = [];
      chaptersData = [];
      sentSpans = [];
      chunkSentences = [];
      lastMark = -1;
      readAlong.hidden = true;
      chaptersSel.hidden = true;
      chaptersSel.innerHTML = "";
    }

    // Add any chunks the server has produced since we last rendered.
    function renderMeta(newMeta) {
      for (let c = chunkSentences.length; c < newMeta.length; c++) {
        const chunkDiv = document.createElement("div");
        const entry = { spans: [], totalChars: 0 };
        const chunkIdx = c;
        for (const paraText of newMeta[c].text.split("\n\n")) {
          const p = document.createElement("p");
          const sentences = splitSentences(paraText);
          sentences.forEach((sentence, si) => {
            const span = document.createElement("span");
            span.className = "sent unread";
            span.textContent = sentence + " ";
            // Click a sentence -> jump the audio there. This is the
            // highlight estimate run in reverse: weighted time before the
            // sentence, as a fraction of the chunk, becomes seconds.
            const weightBefore = entry.totalChars;
            span.addEventListener("click", () => {
              const m = meta[chunkIdx];
              if (!m) return;
              seekToTime(m.start
                + (weightBefore / Math.max(entry.totalChars, 1)) * m.duration);
            });
            p.appendChild(span);
            const weight = sentenceWeight(sentence, si === sentences.length - 1);
            entry.spans.push({ el: span, chars: weight });
            entry.totalChars += weight;
            sentSpans.push(span);
          });
          chunkDiv.appendChild(p);
        }
        chunkSentences.push(entry);
        panelText.appendChild(chunkDiv);
      }
      meta = newMeta;
      readAlong.hidden = false;
    }

    // Offer the chapter list once (it doesn't change during a job).
    function renderChapters() {
      if (!chaptersData.length || chaptersSel.options.length) return;
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Chapters…";
      chaptersSel.appendChild(placeholder);
      chaptersData.forEach((chapter, i) => {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = chapter.title;
        chaptersSel.appendChild(option);
      });
      chaptersSel.hidden = false;
    }

    chaptersSel.addEventListener("change", () => {
      const chapter = chaptersData[Number(chaptersSel.value)];
      chaptersSel.value = "";   // snap back to the placeholder
      if (!chapter) return;
      const m = meta[chapter.chunk];
      if (!m) return;
      // The chapter's offset inside its chunk, as time — using the same
      // pause-aware weighting as the highlighting.
      seekToTime(m.start
        + (weightText(m.text.slice(0, chapter.offset))
           / weightText(m.text)) * m.duration);
    });

    async function fetchMeta(jobId) {
      try {
        const r = await fetch("/api/jobs/" + jobId + "/meta");
        if (!r.ok) return;
        const data = await r.json();
        // Older conversions stored a bare list; newer ones an object.
        renderMeta(Array.isArray(data) ? data : (data.chunks || []));
        chaptersData = Array.isArray(data) ? [] : (data.chapters || []);
        renderChapters();
      } catch (e) { /* panel is a nice-to-have; never break playback over it */ }
    }

    function flatIndexOf(c, s) {
      let idx = 0;
      for (let k = 0; k < c; k++) idx += chunkSentences[k].spans.length;
      return idx + s;
    }

    // Which sentence is the voice on right now? The chunk is known exactly
    // (server-measured timings); the sentence within it is ESTIMATED by
    // assuming characters are spoken at a steady rate — close, not perfect.
    function updateHighlight() {
      if (!meta.length || !currentJob) return;

      let c, within;
      if (mode === "chunks") {
        c = chunkIndex;
        within = player.currentTime;
      } else {
        const pos = player.currentTime;
        c = 0;
        while (c + 1 < meta.length && pos >= meta[c].start + meta[c].duration) c += 1;
        within = pos - meta[c].start;
      }
      if (c >= chunkSentences.length) return;

      const entry = chunkSentences[c];
      const duration = meta[c].duration || player.duration || 1;
      const fraction = Math.min(Math.max(within / duration, 0), 0.999);
      const charTarget = fraction * entry.totalChars;

      let s = 0, seen = 0;
      while (s < entry.spans.length - 1 && seen + entry.spans[s].chars < charTarget) {
        seen += entry.spans[s].chars;
        s += 1;
      }

      const mark = flatIndexOf(c, s);
      if (mark === lastMark) return;   // nothing moved — don't touch the DOM
      lastMark = mark;
      sentSpans.forEach((el, i) => {
        el.className = "sent " + (i < mark ? "read" : i === mark ? "current" : "unread");
      });
      if (!panelText.hidden) {
        entry.spans[s].el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }
    player.addEventListener("timeupdate", updateHighlight);

    // ---- sleep timer -----------------------------------------------------
    const sleepSel = document.getElementById("sleep");
    let sleepTimeout = null;
    sleepSel.addEventListener("change", () => {
      if (sleepTimeout) {
        clearTimeout(sleepTimeout);
        sleepTimeout = null;
      }
      const seconds = parseInt(sleepSel.value, 10);
      const label = seconds < 60 ? seconds + " seconds"
                                 : (seconds / 60) + " minutes";
      if (seconds > 0) {
        sleepTimeout = setTimeout(() => {
          player.pause();   // position is already saved for resume
          status.textContent = "Sleep timer: paused after " + label + ". Sweet dreams.";
          sleepSel.value = "0";
          sleepTimeout = null;
        }, seconds * 1000);
        status.textContent = "Sleep timer set for " + label + ".";
      } else {
        status.textContent = "Sleep timer off.";
      }
    });

    // ---- lock-screen / media-key controls (Media Session API) -----------
    // Lets the phone's lock screen and keyboard media keys drive playback.
    // Guarded: not every browser exposes it (and some only on secure pages).
    function setupMediaSession() {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: currentJob ? currentJob.title : "Document to Speech",
        artist: "Document to Speech",
      });
    }
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => player.play());
      navigator.mediaSession.setActionHandler("pause", () => player.pause());
      navigator.mediaSession.setActionHandler("seekbackward", () => skip(-15));
      navigator.mediaSession.setActionHandler("seekforward", () => skip(15));
    }

    function playChunk(i) {
      player.src = `/api/jobs/${currentJob.id}/chunks/${i}`;
      player.play();
    }

    function switchToFull(offsetSeconds) {
      mode = "full";
      pendingSeek = offsetSeconds;
      player.src = `/api/jobs/${currentJob.id}/audio`;
      player.play();
    }

    // When a chunk finishes, move to the next — or, if the job has finished
    // meanwhile, hop to the stitched file at the exact same position.
    player.addEventListener("ended", () => {
      if (mode !== "chunks") {
        // Finished listening to the whole thing: nothing left to resume.
        localStorage.removeItem("resume");
        resumeBox.hidden = true;
        return;
      }
      chunkIndex += 1;
      playedSeconds = startOf(chunkIndex);
      if (jobDone) {
        switchToFull(playedSeconds);
      } else if (chunkIndex < readyChunks) {
        playChunk(chunkIndex);
      } else {
        waitingForChunk = true;
        status.textContent = "Caught up with the generator — waiting for the next chunk…";
      }
    });

    // ---- remember position (resume) --------------------------------------
    let lastSave = 0;
    player.addEventListener("timeupdate", () => {
      if (!currentJob || player.paused) return;
      const now = Date.now();
      if (now - lastSave < 3000) return;   // save at most every 3 s
      lastSave = now;
      const seconds = mode === "chunks"
        ? playedSeconds + player.currentTime
        : player.currentTime;
      localStorage.setItem("resume", JSON.stringify({
        jobId: currentJob.id, title: currentJob.title, seconds: seconds,
      }));
    });

    // Offer to pick up where the last session left off.
    const saved = JSON.parse(localStorage.getItem("resume") || "null");
    if (saved && saved.seconds > 10) {
      resumeTitle.textContent = saved.title;
      resumeTime.textContent = fmtTime(saved.seconds);
      resumeBox.hidden = false;
    }

    resumeBtn.addEventListener("click", () => {
      currentJob = { id: saved.jobId, title: saved.title, total: 0 };
      mode = "full";
      jobDone = true;
      resetPanel();
      fetchMeta(saved.jobId);   // rebuild the read-along panel if data exists
      setupMediaSession();
      pendingSeek = saved.seconds;
      player.src = `/api/jobs/${saved.jobId}/audio`;
      download.href = `/api/jobs/${saved.jobId}/audio`;
      download.hidden = false;
      playerRow.hidden = false;
      resumeBox.hidden = true;
      player.play();
      status.textContent = "Resumed.";
    });

    // The server forgets conversions eventually (files get cleaned up);
    // fail politely instead of with a dead player.
    player.addEventListener("error", () => {
      if (player.src) {
        status.textContent = "That audio is no longer available — convert the document again.";
        playerRow.hidden = true;
      }
    });

    // ---- character counter -----------------------------------------------
    function updateCount() {
      const n = textBox.value.length;
      counter.textContent = n === 0 ? "" : n.toLocaleString() + " characters"
        + (n > 200000 ? " — over the 200,000 limit; trim before speaking" : "");
    }
    textBox.addEventListener("input", updateCount);

    // ---- file upload → extraction ----------------------------------------
    let lastHeadings = [];   // chapter titles from the last extraction

    filePicker.addEventListener("change", async () => {
      const file = filePicker.files[0];
      if (!file) return;
      status.textContent = "Extracting text from " + file.name + "…";
      const formData = new FormData();
      formData.append("file", file);
      try {
        const response = await fetch("/api/extract", { method: "POST", body: formData });
        if (!response.ok) {
          status.textContent = "Error: " + (await response.json()).detail;
          return;
        }
        const result = await response.json();
        lastHeadings = result.headings || [];
        textBox.value = result.text;
        updateCount();
        status.textContent = "Loaded " + result.characters.toLocaleString()
          + " characters from " + result.filename
          + (lastHeadings.length
             ? " (" + lastHeadings.length + " chapters detected)"
             : "")
          + " — review the text, then press Speak.";
      } catch (networkError) {
        status.textContent = "Could not reach the server — is uvicorn running?";
      }
    });

    // ---- the main event: convert & play progressively --------------------
    button.addEventListener("click", async () => {
      const text = textBox.value.trim();
      if (!text) {
        status.textContent = "Paste some text first.";
        return;
      }

      button.disabled = true;
      playerRow.hidden = true;
      download.hidden = true;
      resumeBox.hidden = true;
      status.textContent = "Starting the job…";

      try {
        const response = await fetch("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, voice: voice.value, headings: lastHeadings }),
        });
        if (!response.ok) {
          status.textContent = "Error: " + (await response.json()).detail;
          return;
        }

        const { job_id, total_chunks } = await response.json();
        currentJob = { id: job_id, title: text.slice(0, 60), total: total_chunks };
        mode = "chunks";
        chunkIndex = 0;
        playedSeconds = 0;
        readyChunks = 0;
        jobDone = false;
        waitingForChunk = false;
        chunkDurations = [];
        resetPanel();
        setupMediaSession();

        progress.max = total_chunks;
        progress.value = 0;
        progress.hidden = false;

        // For the time-remaining estimate: note when chunks started landing
        // and how many, then extrapolate the observed pace.
        let etaBase = null;
        const etaText = (done) => {
          if (!etaBase || done <= etaBase.done || done >= total_chunks) return "";
          const perChunk = (Date.now() - etaBase.time) / 1000 / (done - etaBase.done);
          const left = perChunk * (total_chunks - done);
          return left < 90 ? " — under 2 min left"
                           : " — about " + Math.round(left / 60) + " min left";
        };

        let started = false;
        while (true) {
          const job = await (await fetch("/api/jobs/" + job_id)).json();
          readyChunks = job.done_chunks;
          progress.value = job.done_chunks;
          if (readyChunks > 0 && !etaBase) {
            etaBase = { time: Date.now(), done: readyChunks };
          }

          // Pick up any newly generated chunks' text + timings for the panel.
          if (readyChunks > chunkSentences.length) {
            await fetchMeta(job_id);
          }

          if (job.status === "error") {
            status.textContent = "Error: " + job.error;
            return;
          }

          // The moment chunk one exists, start listening.
          if (!started && readyChunks >= 1) {
            started = true;
            playerRow.hidden = false;
            playChunk(0);
          }
          // If playback caught up and stalled, a fresh chunk un-stalls it.
          if (waitingForChunk && chunkIndex < readyChunks) {
            waitingForChunk = false;
            playChunk(chunkIndex);
          }

          if (job.status === "done") break;

          status.textContent = (started ? "Playing — generating chunk " : "Generating chunk ")
            + Math.min(job.done_chunks + 1, total_chunks) + " of " + total_chunks + "…"
            + (job.done_chunks === 0
               ? " (the first chunk can take a minute or two if the model is waking up)"
               : etaText(job.done_chunks));
          await sleep(1500);
        }

        jobDone = true;
        download.href = "/api/jobs/" + job_id + "/audio";
        download.hidden = false;
        status.textContent = "All " + total_chunks + " chunk"
          + (total_chunks === 1 ? "" : "s") + " generated.";

        // If the player stalled waiting right as the job finished, release it.
        if (waitingForChunk) {
          waitingForChunk = false;
          if (chunkIndex < total_chunks) {
            playChunk(chunkIndex);
          } else {
            switchToFull(playedSeconds);
          }
        }
        // If nothing ever started (e.g. a 1-chunk job that finished between
        // polls), just play the finished audio.
        if (!started) {
          playerRow.hidden = false;
          switchToFull(0);
        }
      } catch (networkError) {
        status.textContent = "Could not reach the server — is uvicorn running?";
      } finally {
        button.disabled = false;
        progress.hidden = true;
      }
    });
  </script>
</body>
</html>
